# Free-tier Supabase pauses after 7 days without activity.
# The home page queries Supabase on every request, so pinging it keeps the DB awake.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 6 * * 1,4" # Mon and Thu 06:00 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site (triggers a Supabase query)
        run: |
          curl -sf --retry 3 --retry-delay 10 -o page.html https://chic-boulevard-website-uq12.vercel.app/
          grep -q '/product/' page.html || { echo "No products on home page - is Supabase paused?"; exit 1; }
      # GitHub disables scheduled workflows in public repos after 60 days without activity.
      - name: Keep this workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
